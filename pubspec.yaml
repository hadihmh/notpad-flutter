name: note
description: Simple NoteBook
publish_to: none
version: 2.1.0+11

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.0
  shared_preferences: ^2.3.2
  intl: ^0.20.1
  url_launcher: ^6.3.1
  flutter_staggered_grid_view: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: launcher_icon
  ios: true
  remove_alpha_ios: true
  image_path: Assets/logo-grey.png

flutter:
  uses-material-design: true
  assets:
    - Assets/logo-grey.png
  fonts:
    - family: Vazirmatn
      fonts:
        - asset: Assets/fonts/Vazirmatn-Regular.ttf
        - asset: Assets/fonts/Vazirmatn-Medium.ttf
          weight: 500
        - asset: Assets/fonts/Vazirmatn-SemiBold.ttf
          weight: 600
        - asset: Assets/fonts/Vazirmatn-Bold.ttf
          weight: 700
